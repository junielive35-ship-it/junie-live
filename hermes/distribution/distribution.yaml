name: junie-live
version: 1.0.0
description: "Junie Live — persistent product-owning senior SWE agent"
hermes_requires: ">=0.12.0"
author: "Junie Live"
license: "MIT"

# Junie ships more profile assets than the distribution defaults (SOUL.md,
# skills/, cron/, mcp.json). List every path explicitly so that profile updates
# refresh all seed files. config.yaml is deliberately omitted so the user's
# model/provider/reasoning choices survive updates.
distribution_owned:
  - SOUL.md
  - INITIALIZATION.md
  - memory-seed.md
  - HERMES.seed.md
  - docs
  - skills
  - plugins
  - scripts
  - junie
  - cron
  - mcp.json
  - distribution.yaml
